services:
  - type: web
    name: finger-backend
    env: docker
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: finger-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_S3_PUBLIC_BASE_URL
        sync: false
      - key: AWS_S3_PRIVATE_URL_TTL_SECONDS
        value: 300
      - key: AWS_S3_ENDPOINT
        sync: false
      - key: AWS_S3_PRESIGN_ENDPOINT
        sync: false
      - key: AWS_S3_FORCE_PATH_STYLE
        value: "true"

databases:
  - name: finger-postgres
